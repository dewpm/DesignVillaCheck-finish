services:
  - type: web
    name: villacheck-backend
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_URL
        value: https://design-villacheck.vercel.app
      - key: BACKEND_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_ACCOUNTS
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
